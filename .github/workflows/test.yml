name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install aiohttp
      - name: Offline core tests
        run: python tests/test_offline.py
      - name: API mock tests
        run: python tests/test_api_mock.py
      - name: Brand registry tests
        run: python tests/test_brands.py
      - name: Cache tests
        run: python tests/test_cache.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # pytest-homeassistant-custom-component pulls in current HA core,
          # which tracks the latest Python supported by Home Assistant.
          python-version: "3.13"
      - name: Install HA test harness
        run: |
          pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Combined coverage (offline + HA harness)
        run: |
          coverage erase
          coverage run --source=custom_components/cupra_eu_data_act tests/test_offline.py
          coverage run -a --source=custom_components/cupra_eu_data_act tests/test_api_mock.py
          coverage run -a --source=custom_components/cupra_eu_data_act tests/test_brands.py
          coverage run -a --source=custom_components/cupra_eu_data_act tests/test_cache.py
          coverage run -a --source=custom_components/cupra_eu_data_act \
            -m pytest tests/ --ignore=tests/test_offline.py -q --tb=short
          coverage report --precision=1 --fail-under=95
          coverage json -o coverage.json
          python scripts/check_module_coverage.py --min 95
